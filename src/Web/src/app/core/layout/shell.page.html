<dx-drawer
  class="shell"
  position="left"
  [openedStateMode]="isHandset() ? 'overlap' : 'shrink'"
  [revealMode]="isHandset() ? 'slide' : 'expand'"
  [opened]="navOpened()"
  [minSize]="isHandset() ? 0 : 60"
  [maxSize]="248"
  [shading]="isHandset()"
>
  <div *dxTemplate="let _ of 'panel'">
    <!-- On a phone the drawer is either fully open or fully gone: there is no
         room for a 60px rail beside the content, so it never renders compact. -->
    <ams-side-nav
      class="shell__nav"
      [class.shell__nav--floating]="isHandset()"
      [compact]="!isHandset() && !navOpened()"
      [badges]="navBadges()"
      (navigated)="onNavigated()"
    ></ams-side-nav>
  </div>

  <div class="shell__body">
    <ams-app-header
      [userName]="displayName()"
      [unreadCount]="unreadCount()"
      (menuToggled)="toggleNav()"
      (notificationsToggled)="togglePanel()"
      (searched)="onSearch($event)"
      (userMenuSelected)="onUserMenu($event)"
    >
    </ams-app-header>

    <main class="shell__content">
      <router-outlet />
    </main>
  </div>
</dx-drawer>

<!--
  A popup rather than a second drawer. Nesting two dx-drawers laid the right
  panel out one viewport-width off-screen (x=2520 in a 1440 viewport) while
  still reporting itself open — the outer drawer measures against the inner
  drawer's box, not the window. A popup positions against the window and needs
  no such assumption.
-->
<dx-popup
  class="shell__panel"
  [visible]="panelOpened()"
  (visibleChange)="panelOpened.set($event)"
  [width]="360"
  height="100%"
  [showTitle]="false"
  [dragEnabled]="false"
  [resizeEnabled]="false"
  [hideOnOutsideClick]="true"
  [shading]="true"
  shadingColor="rgba(0, 0, 0, 0.18)"
  [position]="{ my: 'right', at: 'right', of: 'window' }"
  [wrapperAttr]="{ class: 'shell__panel-wrapper' }"
>
  <div *dxTemplate="let _ of 'content'">
    <ams-notification-panel
      [notifications]="notifications()"
      (closed)="panelOpened.set(false)"
      (allRead)="markAllRead()"
    >
    </ams-notification-panel>
  </div>
</dx-popup>

<dx-popup
  title="Global search"
  [visible]="globalSearchVisible()"
  (visibleChange)="globalSearchVisible.set($event)"
  [width]="'min(760px, 94vw)'"
  [height]="'auto'"
  [maxHeight]="'82vh'"
  [showCloseButton]="true"
  [dragEnabled]="false"
  [hideOnOutsideClick]="true"
  [wrapperAttr]="{ class: 'global-search-dialog' }"
>
  <div *dxTemplate="let _ of 'content'" class="global-search-results">
    <header>
      <span>SEARCHING ACROSS MODULES</span>
      <h2>{{ globalSearchTerm() }}</h2>
      <p>Matching assets, audits and auditors</p>
    </header>

    @if (globalSearchLoading()) {
      <div class="global-search-state">
        <i class="dx-icon-search"></i>
        <strong>Searching all modules…</strong>
      </div>
    } @else if (globalSearchError(); as error) {
      <div class="global-search-state global-search-state--empty">
        <i class="dx-icon-info"></i>
        <strong>{{ error }}</strong>
      </div>
    } @else {
      <div class="global-search-list">
        @for (result of globalSearchResults(); track result.module + '-' + result.id) {
          <button type="button" class="global-search-result" (click)="openGlobalSearchResult(result)">
            <i [class]="'dx-icon-' + result.icon"></i>
            <span class="global-search-result__copy">
              <span class="global-search-result__module">{{ result.module }}</span>
              <strong>{{ result.title }}</strong>
              <small>{{ result.description || 'Open matching record' }}</small>
            </span>
            <i class="dx-icon-chevronright"></i>
          </button>
        }
      </div>
    }
  </div>
</dx-popup>
